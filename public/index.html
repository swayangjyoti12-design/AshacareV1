.sync{padding:13px;display:flex;align-items:center; justify-content:space-between}.linkBtn{border:0;background:none;color:var(--teal);font-size:12px;font-weight:800;padding:5px}

.primary,.dark,.outline{width:100%;border-radius:11px;padding:13px;font-weight:800;font-size:13px;margin-top:8px}.primary{border:0;background:var(--teal);color:#fff}.dark{border:0;background:#0f172a;color:#fff}.outline{border:1px solid var(--line);background:#fff;color:#334155}.primary:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}

label{font-size:12px;font-weight:700;color:#334155;margin-bottom:4px;display:block}

      this.state.caseId = "AC-" + Math.floor(1000 + Math.random() * 9000);

        name: this.state.childName || "Unnamed child",
        age: this.state.childAgeLabel,
        ageUnit: this.state.childAgeUnit,
        level: result.level,
        concern: result.concern,
        re: result.re,
        transcript: this.state.transcript,
        patientId: this.state.selectedPatientId

      try {
        const saved = await this.apiCall('/cases', 'POST', rec);
        this.state.records.unshift(saved);

      <input class="input" value="${this.escape(s.childAge)}" oninput="App.state.childAge=this.value">
      <label class="label">Symptoms</label>
      <textarea id="transcript" class="textarea" oninput="App.state.transcript=this.value">${this.escape(s.transcript)}</textarea>
      <button class="primary" onclick="App.analyze()">${t.analyze}</button>
    </div>`;
  },

  result() {
    const t = this.t(), r = this.state.result;
    return `<button class="back" onclick="App.go('home')">Back</button>
    <div class="resultBanner">
      <h2>${r.level === 'red' ? t.riskRed : t.riskYellow}</h2>
      <p>${r.concern || ''}</p>
    </div>
    <button class="primary" onclick="App.go('home')">Finish</button>`;
  },

  records() {
    const t = this.t(), recs = this.state.records;
    return `<div class="sectionTitle">Case Records</div>
    ${recs.map(r => `<div class="card record"><div><strong>${this.escape(r.name)}</strong></div>${risk(r.level, t)}</div>`).join('')}`;
  }
};

function triage(text, quickKeys) {
  const lower = text.toLowerCase();
  let level = "green", concern = null, re = [];
  if (lower.includes("fever") && lower.includes("pale")) {
    level = "red";
    concern = "Possible serious systemic condition";
    re.push("Prolonged fever paired with pallor indicators.");
  } else if (lower.includes("fever")) {
    level = "yellow";
    concern = "Monitor closely";
    re.push("Fever recorded without secondary red-flag indicators.");
  }
  return { level, concern, re };
}

function risk(level, t) {
  const label = level === "red" ? t.riskRed : level === "yellow" ? t.riskYellow : t.riskGreen;
  return `<span class="risk ${level}"><span class="dot"></span>${label}</span>`;
}

// Boot App
if(App.state.isAuthenticated) App.sync();
App.render();
</script>
</body>
</html>
